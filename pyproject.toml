[project]
name = "asistente-personal"
version = "0.1.0"
description = "Asistente de voz local (Ollama + faster-whisper + Piper) con el teléfono como interfaz."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "faster-whisper>=1.2.1",
    "numpy>=2.5.4",
    "nvidia-cublas-cu12>=12.9.2.10 ; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10 ; sys_platform == 'win32'",
    "piper-tts>=1.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "fonttools>=4.67.0",
    "brotli>=1.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["server"]

[[tool.mypy.overrides]]
# faster-whisper no publica tipos.
module = ["faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true
