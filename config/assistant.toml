# Configuración general del asistente.
# El nombre se lee de aquí; el código nunca lo escribe fijo.

[assistant]
name = "Vega"
language = "es"

[server]
# Solo 127.0.0.1: el teléfono llega por USB con `adb reverse`, nunca por la red Wi-Fi.
# El código rechaza cualquier otra dirección.
host = "127.0.0.1"
port = 8000

[llm]
url = "http://127.0.0.1:11434"
# Modelo pequeño a propósito: ~2,9 GB de memoria de vídeo, para no acaparar la GPU.
# Alternativa más capaz pero más pesada (~5,2 GB): "qwen3:8b".
model = "qwen3.5:4b"
# Tiempo sin uso tras el cual Ollama saca el modelo de la GPU y la deja libre.
# Con la escucha continua («Vega, …») no se puede precargar mientras hablas, así que se
# deja más tiempo: si lo usas a menudo responde al instante (~2,9 GB de VRAM ocupados).
# Si prefieres liberar la GPU antes, baja este valor (la primera respuesta tardará ~5 s).
keep_alive = "30m"
# {name} se reemplaza por el nombre del asistente.
system_prompt = """
Tu nombre es {name}. Eres un asistente personal de voz que corre en el PC del usuario.
Hablas siempre en primera persona («yo», «puedo», «te recuerdo») y nunca hablas de ti en tercera persona.
El usuario NO se llama {name}: {name} eres tú. Nunca le llames {name} ni uses ese nombre para dirigirte a él.
Responde siempre en español, de forma breve (una a tres frases), clara y natural, como en una conversación hablada.
No uses listas, tablas, emojis ni formato Markdown: tus respuestas se leerán en voz alta.
Al final de estas instrucciones tienes la fecha y la hora actuales: úsalas si te preguntan por el día o la hora.
No tienes acceso a internet ni al tiempo (clima): si te piden algo así, dilo con sinceridad en una frase.
Los botones del panel (apagar, grabar, volumen, abrir apps…) los ejecuta el sistema, no tú: no digas que has hecho algo que no has hecho.
"""

[speech]
# Voz a texto (faster-whisper). Medido en la RTX 4060 Ti con frases de ~4 s:
#   small en GPU: ~0,2–0,3 s y ~0,5 GB de VRAM  ← por defecto, ligero
#   large-v3-turbo en GPU: ~0,25–0,3 s y ~1,1 GB de VRAM, más preciso
#   small en CPU: ~2 s (sin GPU funciona, pero más lento)
# Si la GPU no está disponible, se usa la CPU automáticamente.
stt_model = "small"
stt_device = "cuda"
stt_compute = "int8_float16"
# Máximo de una grabación, en segundos.
max_seconds = 30

[memory]
# Historial de conversaciones (SQLite). Fuera de git.
file = "data/history.sqlite"

[logging]
level = "INFO"
dir = "logs"
