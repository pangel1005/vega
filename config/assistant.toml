# Configuración general del asistente.
# El nombre se lee de aquí; el código nunca lo escribe fijo.

[assistant]
name = "Vega"
language = "es"

[server]
# Solo 127.0.0.1: el teléfono llega por USB con `adb reverse`, nunca por la red Wi-Fi.
# El código rechaza cualquier otra dirección.
host = "127.0.0.1"
port = 8000

[llm]
url = "http://127.0.0.1:11434"
# Modelo pequeño a propósito (~3 GB). Alternativa más capaz pero más pesada (~5,2 GB): "qwen3:8b".
model = "qwen3.5:4b"
# Reparto entre la tarjeta gráfica y el procesador. Medido en la RTX 4060 Ti + Ryzen 7 5700X:
#   gpu_layers = 1  → ~650 MB de vídeo, primera palabra en ~0,45 s, ~10 palabras/s  ← por defecto
#   gpu_layers = 0  → nada de vídeo, pero la primera palabra tarda ~2,3 s
#   gpu_layers = -1 → todo en la gráfica: ~3,7 GB de vídeo, ~65 palabras/s
gpu_layers = 1
# Hilos del procesador para el modelo. Se dejan núcleos libres para la voz (Kokoro, 4 hilos).
threads = 6
context = 2048
# Tiempo sin uso tras el cual Ollama saca el modelo de la memoria. Casi todo va en la RAM
# (~3 GB de 32) y cargarlo de nuevo cuesta ~6 s, así que se deja todo el día.
keep_alive = "12h"
# {name} se reemplaza por el nombre del asistente.
# Corto a propósito: en el procesador, el modelo relee estas instrucciones en cada turno
# (Qwen 3.5 no puede reaprovecharlas), y cada línea de más retrasa la primera palabra.
system_prompt = """
Eres {name}, asistente de voz del usuario (él no se llama {name}). Habla en primera persona y en español.
Responde MUY breve: una o dos frases cortas, sin preguntas de cortesía al final, sin listas, emojis ni Markdown (se leerá en voz alta).
Usa la fecha y hora que se te dan. No tienes internet ni clima: dilo si te lo piden.
Los botones (apagar, volumen, abrir apps…) los ejecuta el sistema, no tú: no digas que hiciste algo que no hiciste.
"""

[speech]
# Voz a texto (faster-whisper). Medido con frases de ~3 s:
#   base en CPU: ~0,6 s y sin tarjeta gráfica (para no gastar nada de GPU: "base", "cpu", "int8")
#   small en CPU: ~1,5 s, algo más preciso
#   small en GPU ("cuda", "int8_float16"): ~0,2–0,3 s, pero ocupa ~1 GB de vídeo  ← activo
stt_model = "small"
stt_device = "cuda"
stt_compute = "int8_float16"
# Máximo de una grabación, en segundos.
max_seconds = 30

# Texto a voz, en la CPU (no usa la GPU). La voz se cambia desde la app (MÁS → VOZ);
# la elegida se guarda en data/prefs.json y tiene prioridad sobre este valor.
#   Kokoro (natural, models/kokoro): "kokoro:ef_dora", "kokoro:dora_suave", "kokoro:dora_calida",
#     "kokoro:em_alex", "kokoro:em_santa"
#     ~3,4 veces más rápido que el tiempo real en este PC.
#   Piper (más robótica, models/piper): "es_MX-claude-high", "es_AR-daniela-high"…
#     ~28 veces más rápido que el tiempo real.
tts_enabled = true
tts_voice = "kokoro:ef_dora"
# Velocidad al hablar (solo Kokoro): 1.0 normal (la más natural), 1.1 algo más ágil.
tts_speed = 1.0
# Acento de Kokoro: "es-419" latinoamericano («sena», «sinco») o "es" de España («θena»).
tts_accent = "es-419"

[device]
# Teléfono por cable USB: el servidor vigila adb y, al conectar el teléfono, aplica
# `adb reverse` y abre la app. Ruta de adb vacía = buscarla sola (SDK, winget, PATH).
usb_watcher = true
adb_path = ""
open_app_on_connect = true

[media]
# Modo letra de la pantalla «Sonando»: busca la letra en lrclib.net (gratis, sin cuenta).
# Es lo único que usa internet: manda solo título, artista, álbum y duración de la canción.
lyrics = true
# Analizador de espectro del teléfono (barras de LED como en una radio de coche). Analiza el audio de Spotify,
# solo el de Spotify, dentro de la memoria del PC: no se graba, no se guarda y no sale ni un segundo de audio;
# al teléfono solo viajan ~24 números por cada instante. false = sin espectro.
spectrum = true

[games]
# Sección «Juego» del teléfono: el juego que tienes abierto en el PC (Steam o Epic), con su carátula, el tiempo de esta
# sesión, tus horas totales y su información. Solo mira qué juego está abierto; no lee nada de dentro del juego.
enabled = true
# Descripción, géneros y nota desde la tienda pública de Steam: solo se le manda el número del juego y se guarda en
# data/games. false = solo lo que Steam ya tiene en este PC (nombre, carátula y horas).
store_info = true
# Números de Steam que no son juegos y no deben salir (Wallpaper Engine y Steamworks ya se ignoran).
ignore = []
# Cuenta de Steam (opcional): guarda tu «Web API key» (gratis en steamcommunity.com/dev/apikey) en
# config/steam_key.txt, una sola línea. Es tuya: no se muestra ni se escribe en los registros y solo se manda a
# api.steampowered.com. Con ella salen tus logros del juego y qué amigos juegan a lo mismo. Tu perfil de Steam debe
# tener «Detalles del juego» en público. Sin ella, la sección funciona igual pero sin logros ni amigos.
friends = true
# La partida en curso (League of Legends y Rocket League) desde sus APIs locales oficiales, solo lectura: marcador,
# tiempo y tus estadísticas. Rocket League trae su API desactivada: pon PacketSendRate=10 en
# <instalación>/TAGame/Config/DefaultStatsAPI.ini y reinicia el juego (tools/rocket_league_stats.py lo hace).
match = true
rocket_port = 49123

[intents]
# Entender por significado: además de las frases exactas, Vega entiende «apágame la compu» o «súbele a la
# música» comparando lo que dices con ejemplos de cada botón (modelo pequeño en el PC; se baja una vez, ~120 MB,
# y después no usa internet). Si duda, pregunta «¿quieres…?» antes de actuar. false = solo las frases exactas.
semantic = true
# act = parecido desde el que lo ejecuta · ask = desde el que pregunta antes · margin = ventaja sobre la 2.ª opción
act = 0.62
ask = 0.50
margin = 0.04

[weather]
# El tiempo («Vega, ¿qué tiempo hace?»). Apagado de serie: sale a internet (open-meteo.com) y solo envía
# las coordenadas de la ciudad. Lo más cómodo es activarlo desde Ajustes en la app del PC.
enabled = false
city = ""
# latitude = 40.4168
# longitude = -3.7038

[notifications]
# Ver en el teléfono las notificaciones del PC (Discord, WhatsApp, correo…). Solo viajan
# por el cable al teléfono; no se guardan. Windows debe permitirlo en Configuración →
# Privacidad y seguridad → Notificaciones.
enabled = true

[memory]
# Historial de conversaciones (SQLite). Fuera de git.
file = "data/history.sqlite"

[logging]
level = "INFO"
dir = "logs"
