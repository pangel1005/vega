# Configuración de Vega: los valores de serie.
#
# NO edites este archivo: la primera vez que arranca, Vega lo copia a config/assistant.toml (fuera de git) y ese es
# el tuyo. Cámbialo a mano o desde la app de escritorio (Ajustes). scripts\instalar.ps1 lo ajusta a tu tarjeta
# gráfica. El nombre se lee de aquí; el código nunca lo escribe fijo.

[assistant]
name = "Vega"
language = "es"

[server]
# Solo 127.0.0.1: el teléfono llega por USB con `adb reverse`, nunca por la red Wi-Fi.
# El código rechaza cualquier otra dirección.
host = "127.0.0.1"
port = 8000

[llm]
url = "http://127.0.0.1:11434"
# Modelo pequeño a propósito (~3 GB). Alternativa más capaz pero más pesada (~5,2 GB): "qwen3:8b".
model = "qwen3.5:4b"
# Reparto entre la tarjeta gráfica y el procesador. Medido en la RTX 4060 Ti + Ryzen 7 5700X:
#   gpu_layers = 1  → ~650 MB de vídeo, primera palabra en ~0,45 s, ~10 palabras/s  ← por defecto
#   gpu_layers = 0  → nada de vídeo, pero la primera palabra tarda ~2,3 s
#   gpu_layers = -1 → todo en la gráfica: ~3,7 GB de vídeo, ~65 palabras/s
gpu_layers = 1
# La IA sigue a tu PC: sin juego abierto usa `gpu_layers_free` (-1 = todo en la gráfica: respuesta en ~0,7 s en vez
# de 3–4 s, a costa de ~3 GB de vídeo) y en cuanto abres un juego (o otro programa se queda con el vídeo) vuelve a
# `gpu_layers` y la voz a texto pasa al procesador (`stt_game_model`), para no quitarle nada al juego.
# Vuelve a la gráfica 20 s después de cerrarlo, y solo si caben `gpu_free_mib` MiB libres. false = fijo, como antes.
follow_game = true
# Medido (RTX 4060 Ti, escritorio normal abierto): todas las capas = 3,7 GB de vídeo y 0,6 s por respuesta (deja
# solo ~0,5 GB libres con Discord y la cámara); 24 capas = 2,2 GB y 1,8 s; 16 capas = 1,7 GB y 2,5 s; 1 capa = 0,6 GB y 3,5 s.
gpu_layers_free = 24
gpu_free_mib = 4000
# Hilos del procesador para el modelo; 0 = automático (la mitad de los del PC, entre 2 y 8). Se dejan núcleos
# libres para la voz (Kokoro, 4 hilos).
threads = 0
context = 2048
# Más bajo = menos inventos. Medido con 20 preguntas: a 0,8 mezclaba francés, contaba mal y metía datos tuyos donde no tocaba.
temperature = 0.5
# Tiempo sin uso tras el cual Ollama saca el modelo de la memoria. Casi todo va en la RAM
# (~3 GB de 32) y cargarlo de nuevo cuesta ~6 s, así que se deja todo el día.
keep_alive = "12h"
# {name} se reemplaza por el nombre del asistente.
# Corto a propósito: en el procesador, el modelo relee estas instrucciones en cada turno
# (Qwen 3.5 no puede reaprovecharlas), y cada línea de más retrasa la primera palabra.
system_prompt = """
Eres {name}, la asistente de voz de tu usuario. Respondes siempre en español, con una o dos frases cortas y naturales, como si hablaras.
Contesta solo a lo que se pregunta y termina ahí: sin preguntas al final, sin ofrecer más ayuda, sin presentarte y sin listas, emojis ni Markdown.
Si no sabes algo o no puedes saberlo (noticias, tiempo, internet, lugares cercanos), dilo en una frase corta; nunca te inventes datos ni digas que vas a buscar algo.
Para la fecha y la hora usa exactamente la que se te da. En las cuentas, calcula con cuidado.
No digas que has hecho algo que no has hecho.
"""

[speech]
# Voz a texto (faster-whisper). Medido con frases de ~3 s:
#   base en CPU: ~0,6 s y sin tarjeta gráfica (para no gastar nada de GPU: "base", "cpu", "int8")
#   small en CPU: ~1,5 s, algo más preciso
#   small en GPU ("cuda", "int8_float16"): ~0,2–0,3 s, pero ocupa ~1 GB de vídeo  ← activo
# Sin tarjeta NVIDIA no pasa nada: si "cuda" no arranca, usa el procesador solo.
stt_model = "small"
stt_device = "cuda"
stt_compute = "int8_float16"
# Mientras hay un juego abierto la voz a texto va en el procesador con este modelo (~0,6 s por frase).
stt_game_model = "base"
# Máximo de una grabación, en segundos.
max_seconds = 30

# Texto a voz, en la CPU (no usa la GPU). La voz se cambia desde la app (MÁS → VOZ);
# la elegida se guarda en data/prefs.json y tiene prioridad sobre este valor.
#   Kokoro (natural, models/kokoro): "kokoro:ef_dora", "kokoro:dora_suave", "kokoro:dora_calida",
#     "kokoro:em_alex", "kokoro:em_santa"
#     ~3,4 veces más rápido que el tiempo real en este PC.
#   Piper (más robótica, models/piper): "es_MX-claude-high", "es_AR-daniela-high"…
#     ~28 veces más rápido que el tiempo real.
tts_enabled = true
tts_voice = "kokoro:ef_dora"
# Velocidad al hablar (solo Kokoro): 1.0 normal (la más natural), 1.1 algo más ágil.
tts_speed = 1.0
# Acento de Kokoro: "es-419" latinoamericano («sena», «sinco») o "es" de España («θena»).
tts_accent = "es-419"

[device]
# Teléfono por cable USB: el servidor vigila adb y, al conectar el teléfono, aplica
# `adb reverse` y abre la app. Ruta de adb vacía = buscarla sola (SDK, winget, PATH).
usb_watcher = true
adb_path = ""
open_app_on_connect = true

[media]
# Modo letra de la pantalla «Sonando»: busca la letra en lrclib.net (gratis, sin cuenta).
# Es lo único que usa internet: manda solo título, artista, álbum y duración de la canción.
lyrics = true
# Analizador de espectro del teléfono (barras de LED como en una radio de coche). Analiza el audio de Spotify,
# solo el de Spotify, dentro de la memoria del PC: no se graba, no se guarda y no sale ni un segundo de audio;
# al teléfono solo viajan ~24 números por cada instante. false = sin espectro.
spectrum = true

[games]
# Sección «Juego» del teléfono: el juego que tienes abierto en el PC (Steam o Epic), con su carátula, el tiempo de esta
# sesión, tus horas totales y su información. Solo mira qué juego está abierto; no lee nada de dentro del juego.
enabled = true
# Descripción, géneros y nota desde la tienda pública de Steam: solo se le manda el número del juego y se guarda en
# data/games. false = solo lo que Steam ya tiene en este PC (nombre, carátula y horas).
store_info = true
# Números de Steam que no son juegos y no deben salir (Wallpaper Engine y Steamworks ya se ignoran).
ignore = []
# Cuenta de Steam (opcional): guarda tu «Web API key» (gratis en steamcommunity.com/dev/apikey) en
# config/steam_key.txt, una sola línea. Es tuya: no se muestra ni se escribe en los registros y solo se manda a
# api.steampowered.com. Con ella salen tus logros del juego y qué amigos juegan a lo mismo. Tu perfil de Steam debe
# tener «Detalles del juego» en público. Sin ella, la sección funciona igual pero sin logros ni amigos.
friends = true
# La partida en curso (League of Legends y Rocket League) desde sus APIs locales oficiales, solo lectura: marcador,
# tiempo y tus estadísticas. Rocket League trae su API desactivada: pon PacketSendRate=10 en
# <instalación>/TAGame/Config/DefaultStatsAPI.ini y reinicia el juego (tools/rocket_league_stats.py lo hace).
match = true
rocket_port = 49123
# Forza Horizon: activa «Data Out» en los ajustes del juego con IP 127.0.0.1 y este puerto UDP.
forza_port = 5300
# Counter-Strike 2: la integración oficial («Game State Integration») la crea tools/cs2_gsi.py con tu permiso.

[telegram]
# Vega fuera de casa: escríbele desde Telegram («recuérdame…», «pon un fondo de paisaje», cualquier pregunta) y recibe
# sus recordatorios cuando el teléfono no está conectado. El PC pregunta a Telegram (nada entra a tu red) y solo
# contesta a las cuentas de config/telegram.json, que se crea con `python -m server.tools.telegram_setup`
# (ahí vive el token del bot; está fuera de git). De los botones del PC solo apaga, y siempre preguntando antes
# con botones («/apagar», «apaga la PC» o tras «buenas noches»), con 60 s para cancelarlo.
enabled = false
reminders = "away"   # away: solo si el teléfono no está conectado · always: siempre · never: nunca

[moodle]
# Entregas de la universidad: Vega lee el calendario que exporta tu Moodle (sin tu contraseña) y te avisa antes de
# que venza cada tarea, por el teléfono y, si no está conectado, por Telegram. El enlace de exportación se guarda con
# `python -m server.tools.moodle_setup` en config/moodle.json (fuera de git). Di «ya entregué <tarea>» para
# que no te avise de lo hecho, o «qué tareas tengo» para ver lo pendiente.
enabled = false
alerts = [60]          # minutos antes de la entrega en que avisa; [1440, 60] = un día antes y una hora antes
refresh_minutes = 20   # cada cuánto relee el calendario
only_deadlines = true  # solo lo que vence o cierra (no «se abre»)

[xiaozhi]
# PROTOTIPO: que una placa ESP32 con el firmware abierto «xiaozhi» (78/xiaozhi-esp32) sea un altavoz de voz de Vega:
# la placa detecta la palabra de activación y manda el audio; Vega lo entiende (Whisper), contesta (el modelo del PC y las
# habilidades) y le devuelve la voz (Kokoro). Atiende en ws://127.0.0.1:8000/xiaozhi/v1/ con el mismo token que la app.
# Solo escucha en este PC: para una placa de verdad en la red de casa hay que abrir el servidor a la red (decisión aparte).
enabled = false

[camera]
# La cámara del teléfono como cámara de Windows (para Discord, el navegador…), con el icono de cámara de la app.
# Usa scrcpy y OBS Studio (winget install Genymobile.scrcpy OBSProject.OBSStudio): scrcpy lleva la cámara por el
# cable USB sin instalar nada en el teléfono y OBS la publica como «OBS Virtual Camera». Todo queda en segundo plano
# (la ventana al fondo, OBS en la bandeja) y se apaga del todo al desactivarla. Medido: ~0,4 % de CPU, ~250 MB de
# memoria y ~3 % de la gráfica mientras está encendida.
enabled = false
facing = "front"   # front (frontal) o back (trasera)
rotate = 180       # giro de la imagen en grados: con el teléfono tumbado sale al revés
size = "1280x720"  # tamaño de la imagen que ven los programas
# Al apagar la cámara, OBS se queda en la bandeja (~180 MB): Discord y compañía no pierden la cámara y al encenderla
# otra vez la imagen vuelve sola. false = se cierra todo, pero esos programas se quedan con el logotipo de OBS
# hasta que vuelvas a elegir la cámara en ellos.
keep_obs = true

[intents]
# Entender por significado: además de las frases exactas, Vega entiende «apágame la compu» o «súbele a la
# música» comparando lo que dices con ejemplos de cada botón (modelo pequeño en el PC; se baja una vez, ~120 MB,
# y después no usa internet). Si duda, pregunta «¿quieres…?» antes de actuar. false = solo las frases exactas.
semantic = true
# act = parecido desde el que lo ejecuta · ask = desde el que pregunta antes · margin = ventaja sobre la 2.ª opción
act = 0.62
ask = 0.50
margin = 0.04

[weather]
# El tiempo («Vega, ¿qué tiempo hace?»). Apagado de serie: sale a internet (open-meteo.com) y solo envía
# las coordenadas de la ciudad. Lo más cómodo es activarlo desde Ajustes en la app del PC.
enabled = false
city = ""
# latitude = 40.4168
# longitude = -3.7038

[notifications]
# Ver en el teléfono las notificaciones del PC (Discord, WhatsApp, correo…). Solo viajan
# por el cable al teléfono; no se guardan. Windows debe permitirlo en Configuración →
# Privacidad y seguridad → Notificaciones.
enabled = true

[memory]
# Historial de conversaciones (SQLite). Fuera de git.
file = "data/history.sqlite"

[logging]
level = "INFO"
dir = "logs"
